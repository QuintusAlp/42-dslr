[project]
name = "dslr"
version = "0.1.0"
description = ""
authors = [
    {name = "margauuuuuxx",email = "margaux.loncour@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]

[tool.poetry.scripts]
describe = "srcs.v1_data_analysis.describe:main"
histogram = "srcs.v2_data_visualization.histogram:main"
pair_plot = "srcs.v2_data_visualization.pair_plot:main"
scatter_plot = "srcs.v2_data_visualization.scatter_plot:main"

[[tool.poetry.packages]]
include = "srcs"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
